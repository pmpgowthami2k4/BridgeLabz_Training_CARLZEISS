version: "3.9"

services:
  # ---------------- INFRA ----------------

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Pass123"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---------------- DAPR PLACEMENT ----------------

  # placement:
  #   image: daprio/dapr
  #   container_name: dapr-placement
  #   command: ["./placement", "-port", "50006"]
  #   ports:
  #     - "50006:50006"

  # ---------------- USER SERVICE ----------------

  userservice:
    build:
      context: .
      dockerfile: Dockerfile_user
    container_name: userservice
    ports:
      - "5001:8080"
    depends_on:
      - mongodb

  # userservice-dapr:
  #   image: daprio/daprd:latest
  #   container_name: userservice-dapr
  #   network_mode: "service:userservice"
  #   command:
  #     [
  #       "./daprd",
  #       "-app-id", "userservice",
  #       "-app-port", "8080",
  #       "-dapr-http-port", "3501",
  #       "-placement-host-address", "placement:50006"
  #     ]
  #   depends_on:
  #     - userservice
  #     - placement

  # ---------------- NOTES SERVICE ----------------

  notesservice:
    build:
      context: .
      dockerfile: Dockerfile_notes
    container_name: notesservice
    ports:
      - "5002:8080"
      - "3502:3502"
    depends_on:
      - redis

  # notesservice-dapr:
  #   image: daprio/daprd:latest
  #   container_name: notesservice-dapr
  #   network_mode: "service:notesservice"
  #   command:
  #     [
  #       "./daprd",
  #       "-app-id", "notesservice",
  #       "-app-port", "8080",
  #       "-dapr-http-port", "3502",
  #       "-placement-host-address", "placement:50006",
  #       "-resources-path", "/components"
  #     ]
  #   volumes:
  #     - ./components:/components
  #   depends_on:
  #     - notesservice
  #     - placement

  # ---------------- LABEL SERVICE ----------------

  labelservice:
    build:
      context: .
      dockerfile: Dockerfile_label
    container_name: labelservice
    ports:
      - "5003:8080"
    depends_on:
      - sqlserver

  # ---------------- COLLABORATOR SERVICE ----------------

  collaboratorservice:
    build:
      context: .
      dockerfile: Dockerfile_collaborator
    container_name: collaboratorservice
    ports:
      - "5004:8080"
      - "3504:3504"
    depends_on:
      - sqlserver
      - rabbitmq

  # collaboratorservice-dapr:
  #   image: daprio/daprd:latest
  #   container_name: collaboratorservice-dapr
  #   network_mode: "service:collaboratorservice"
  #   command:
  #     [
  #       "./daprd",
  #       "-app-id", "collaboratorservice",
  #       "-app-port", "8080",
  #       "-dapr-http-port", "3504",
  #       "-placement-host-address", "placement:50006",
  #       "-resources-path", "/components"
  #     ]
  #   volumes:
  #     - ./components:/components
  #   depends_on:
  #     - collaboratorservice
  #     - placement

  # ---------------- GATEWAY ----------------

  gateway:
    build:
      context: .
      dockerfile: Dockerfile_gateway
    container_name: gateway
    ports:
      - "7000:8080"
    depends_on:
      - userservice
      - notesservice
      - labelservice
      - collaboratorservice

# ---------------- VOLUMES ----------------

volumes:
  sql_data:
  mongo_data: